<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math Lessons</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HOME -->
    <section id="home" class="page">

        <h1>📚 Math Lessons</h1>

        <p>Choose your grade to start learning.</p>

        <div id="grade-list" class="card-grid"></div>

    </section>


    <!-- CATEGORIES -->
    <section id="categories" class="page hidden">

        <button class="back-button" onclick="showHome()">
            ← Back
        </button>

        <h1 id="category-title"></h1>

        <p>Choose a math topic.</p>

        <div id="category-list" class="card-grid"></div>

    </section>


    <!-- LESSON LIST -->
    <section id="lessons" class="page hidden">

        <button
            class="back-button"
            onclick="showCategories(selectedGrade)"
        >
            ← Back
        </button>

        <h1 id="lesson-title"></h1>

        <p>Choose a lesson.</p>

        <div id="lesson-list" class="lesson-list"></div>

    </section>


    <!-- LESSON -->
    <section id="lesson-page" class="page hidden">

        <button
            class="back-button"
            onclick="showLessons(selectedCategory)"
        >
            ← Back
        </button>

        <h1 id="lesson-page-title"></h1>

        <!-- EXPLANATION -->
        <div class="lesson-content">

            <h2>📖 Learn</h2>

            <p id="lesson-explanation"></p>

        </div>


        <!-- PRACTICE -->
        <div id="practice">

            <h2>🧠 Practice</h2>

            <p id="question-number"></p>

            <h2 id="question-text"></h2>

            <input
                id="answer-input"
                type="text"
                placeholder="Type your answer"
                autocomplete="off"
            >

            <br><br>

            <button id="check-button">
                Check Answer
            </button>

            <p id="feedback"></p>

        </div>


        <!-- COMPLETION -->
        <div id="completion" class="hidden">

            <h2>🎉 Lesson Complete!</h2>

            <h2 id="score"></h2>

            <p id="result-message"></p>

            <button onclick="showLessons(selectedCategory)">
                Back to Lessons
            </button>

        </div>

    </section>


    <footer>
        <p>Math Lessons</p>
    </footer>


    <script src="lessons.js"></script>

</body>
</html>
