<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Lessons</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 Math Lessons</h1>
        <p>Learn math one lesson at a time.</p>
    </header>

    <main>

        <!-- HOME -->
        <section id="home" class="page">
            <h2>Choose a Grade</h2>

            <div id="grade-list" class="card-grid"></div>
        </section>


        <!-- CATEGORIES -->
        <section id="categories" class="page hidden">
            <button class="back-button" onclick="showHome()">← Back</button>

            <h2 id="category-title">Categories</h2>

            <div id="category-list" class="card-grid"></div>
        </section>


        <!-- LESSON LIST -->
        <section id="lessons" class="page hidden">
            <button class="back-button" onclick="showCategories()">← Back</button>

            <h2 id="lesson-title">Lessons</h2>

            <div id="lesson-list" class="lesson-list"></div>
        </section>


        <!-- ACTUAL LESSON -->
        <section id="lesson-page" class="page hidden">
            <button class="back-button" onclick="showLessons()">← Back</button>

            <article class="lesson-content">

                <h2 id="current-lesson-title"></h2>

                <div id="current-lesson-content"></div>

            </article>
        </section>

    </main>

    <footer>
        <p>Math Lessons</p>
    </footer>

    <script src="lessons.js"></script>

</body>
</html>
